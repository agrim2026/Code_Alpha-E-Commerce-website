<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NovaCart - Sign Up</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
        }

        .navbar {
            background: #111827;
            color: white;
            padding: 20px 50px;
            font-size: 24px;
            font-weight: bold;
        }

        .container {
            width: 350px;
            margin: 70px auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.15);
        }

        h2 {
            text-align: center;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #2563eb;
            color: white;
            border: none;
            cursor: pointer;
            margin-top: 10px;
        }

        #message {
            text-align: center;
            margin-top: 15px;
        }

        a {
            display: block;
            text-align: center;
            margin-top: 15px;
        }
    </style>
</head>

<body>

    <div class="navbar">
        NovaCart
    </div>

    <div class="container">

        <h2>Create Account</h2>

        <form id="signupForm">

            <input
                type="text"
                id="name"
                placeholder="Full Name"
                required
            >

            <input
                type="email"
                id="email"
                placeholder="Email"
                required
            >

            <input
                type="password"
                id="password"
                placeholder="Password"
                required
            >

            <button type="submit">
                Sign Up
            </button>

        </form>

        <p id="message"></p>

        <a href="/login.html">
            Already have an account? Login
        </a>

    </div>

    <script>

        document.getElementById("signupForm").addEventListener("submit", async function(e) {

            e.preventDefault();

            const name = document.getElementById("name").value;
            const email = document.getElementById("email").value;
            const password = document.getElementById("password").value;

            try {

                const response = await fetch("/api/auth/signup", {

                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({
                        name,
                        email,
                        password
                    })

                });

                const data = await response.json();

                document.getElementById("message").textContent = data.message;

                if (response.ok) {

                    setTimeout(() => {
                        window.location.href = "/login.html";
                    }, 1000);

                }

            } catch (error) {

                document.getElementById("message").textContent =
                    "Something went wrong";

                console.error(error);

            }

        });

    </script>

</body>
</html>
