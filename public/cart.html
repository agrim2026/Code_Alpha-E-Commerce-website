<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NovaCart - Cart</title>

    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            background: #f7f8fc;
        }

        .navbar {
            background: #111827;
            color: white;
            padding: 18px 7%;
            display: flex;
            justify-content: space-between;
        }

        .logo {
            color: #60a5fa;
            font-size: 26px;
            font-weight: bold;
        }

        .back {
            color: white;
            text-decoration: none;
        }

        .container {
            width: 86%;
            max-width: 900px;
            margin: 40px auto;
        }

        .cart-item {
            background: white;
            padding: 20px;
            margin-bottom: 15px;
            border-radius: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 3px 12px rgba(0,0,0,0.08);
        }

        .quantity {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .quantity button {
            border: none;
            background: #2563eb;
            color: white;
            width: 32px;
            height: 32px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 18px;
        }

        .remove {
            border: none;
            background: #dc2626;
            color: white;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
        }

        .total {
            background: white;
            padding: 20px;
            margin-top: 25px;
            border-radius: 10px;
            text-align: right;
        }

        .shop-btn {
            display: inline-block;
            margin-top: 20px;
            background: #2563eb;
            color: white;
            padding: 12px 20px;
            border-radius: 7px;
            text-decoration: none;
        }
    </style>
</head>

<body>

    <nav class="navbar">
        <div class="logo">NovaCart</div>
        <a class="back" href="/">← Continue Shopping</a>
    </nav>

    <div class="container">
        <h1>🛒 Your Cart</h1>

        <div id="cart-items"></div>

        <div class="total">
            <h2>Total: ₹<span id="cart-total">0</span></h2>
        </div>

<a href="/checkout.html" class="shop-btn">
    Proceed to Checkout →
</a>
    </div>

    <script>
        let cart = JSON.parse(localStorage.getItem("cart")) || [];

        function displayCart() {
            const cartItems = document.getElementById("cart-items");
            const cartTotal = document.getElementById("cart-total");

            cartItems.innerHTML = "";
            let total = 0;

            if (cart.length === 0) {
                cartItems.innerHTML = "<h2>Your cart is empty</h2>";
                cartTotal.textContent = "0";
                return;
            }

            cart.forEach((product, index) => {

                const quantity = product.quantity || 1;

                total += product.price * quantity;

                cartItems.innerHTML += `
                    <div class="cart-item">

                        <div>
                            <h3>${product.name}</h3>
                            <p>₹${product.price}</p>
                        </div>

                        <div class="quantity">
                            <button onclick="decreaseQuantity(${index})">−</button>

                            <span>${quantity}</span>

                            <button onclick="increaseQuantity(${index})">+</button>

                            <button class="remove"
                                onclick="removeProduct(${index})">
                                Remove
                            </button>
                        </div>

                    </div>
                `;
            });

            cartTotal.textContent = total;
        }

        function increaseQuantity(index) {
            cart[index].quantity = (cart[index].quantity || 1) + 1;

            localStorage.setItem("cart", JSON.stringify(cart));

            displayCart();
        }

        function decreaseQuantity(index) {
            cart[index].quantity = (cart[index].quantity || 1) - 1;

            if (cart[index].quantity <= 0) {
                cart.splice(index, 1);
            }

            localStorage.setItem("cart", JSON.stringify(cart));

            displayCart();
        }

        function removeProduct(index) {
            cart.splice(index, 1);

            localStorage.setItem("cart", JSON.stringify(cart));

            displayCart();
        }

        displayCart();
    </script>

</body>
</html>
