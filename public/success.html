<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NovaCart - Order Successful</title>

    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            background: #f7f8fc;
            color: #222;
        }

        .success-container {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .success-box {
            background: white;
            width: 100%;
            max-width: 550px;
            text-align: center;
            padding: 50px 30px;
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
        }

        .icon {
            font-size: 70px;
            margin-bottom: 20px;
        }

        h1 {
            color: #111827;
            margin-bottom: 15px;
        }

        p {
            color: #6b7280;
            line-height: 1.6;
        }

        .home-btn {
            display: inline-block;
            margin-top: 25px;
            padding: 13px 24px;
            background: #2563eb;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="success-container">

        <div class="success-box">

            <div class="icon">🎉</div>

            <h1>Order Placed Successfully!</h1>

            <p>
                Thank you for shopping with NovaCart.
                Your order has been received successfully.
            </p>

            <a href="/" class="home-btn">
                Continue Shopping
            </a>

        </div>

    </div>

</body>
</html>
